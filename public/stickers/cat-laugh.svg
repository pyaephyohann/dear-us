<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes shake { 0%,100%{transform:translateX(0) rotate(0deg)} 15%{transform:translateX(-2px) rotate(-2deg)} 30%{transform:translateX(2px) rotate(2deg)} 45%{transform:translateX(-1.5px) rotate(-1.5deg)} 60%{transform:translateX(1.5px) rotate(1.5deg)} 75%{transform:translateX(-1px) rotate(-1deg)} }
    @keyframes tear1 { 0%,100%{transform:translateY(0);opacity:.7} 50%{transform:translateY(5px);opacity:0} }
    @keyframes tear2 { 0%,100%{transform:translateY(0);opacity:.6} 50%{transform:translateY(4px);opacity:0} }
    @keyframes ha { 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.2);opacity:1} }
    .sh{animation:shake .5s ease-in-out infinite}
    .t1{animation:tear1 1.5s ease-in-out infinite}
    .t2{animation:tear2 1.5s ease-in-out infinite .5s}
    .ha{animation:ha 1.2s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.sh,.t1,.t2,.ha{animation:none}}
  </style>
  <!-- Laugh tears / ha text -->
  <g class="ha" opacity=".7"><text x="18" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ff8fa8">ha</text></g>
  <g class="ha" style="animation-delay:.4s" opacity=".6"><text x="82" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffb3c6">ha!</text></g>
  <!-- Tear drops -->
  <g class="t1"><ellipse cx="38" cy="44" rx="2" ry="3" fill="#87CEEB" opacity=".6"/></g>
  <g class="t2"><ellipse cx="82" cy="43" rx="1.8" ry="2.5" fill="#87CEEB" opacity=".5"/></g>
  <!-- Shaking laughing cat -->
  <g class="sh">
    <!-- Body -->
    <ellipse cx="60" cy="78" rx="25" ry="22" fill="#e8e0d0"/>
    <circle cx="60" cy="50" r="24" fill="#e8e0d0"/>
    <!-- Ears -->
    <path d="M38 34 L32 10 L50 28Z" fill="#e8e0d0"/>
    <path d="M82 34 L88 10 L70 28Z" fill="#e8e0d0"/>
    <path d="M40 32 L35 15 L49 29Z" fill="#d8c8b0"/>
    <path d="M80 32 L85 15 L71 29Z" fill="#d8c8b0"/>
    <!-- Eyes squeezed shut laughing -->
    <path d="M46 44 Q50 39 54 44" stroke="#3d2c2c" strokeWidth="2.5" fill="none" stroke-linecap="round"/>
    <path d="M66 44 Q70 39 74 44" stroke="#3d2c2c" strokeWidth="2.5" fill="none" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="42" cy="50" rx="5" ry="3" fill="#ffb3a0" opacity=".5"/>
    <ellipse cx="78" cy="50" rx="5" ry="3" fill="#ffb3a0" opacity=".5"/>
    <!-- Nose -->
    <path d="M58 50 L60 53 L62 50Z" fill="#e88a9a"/>
    <!-- Wide open laughing mouth -->
    <path d="M48 55 Q60 70 72 55" stroke="#3d2c2c" strokeWidth="2" fill="#3d2c2c" stroke-linecap="round"/>
    <!-- Teeth showing -->
    <rect x="54" y="55" width="5" height="3" rx="1" fill="white"/>
    <rect x="61" y="55" width="5" height="3" rx="1" fill="white"/>
    <!-- Tongue -->
    <ellipse cx="60" cy="62" rx="5" ry="3.5" fill="#ff8fa8"/>
    <!-- Whiskers -->
    <line x1="30" y1="48" x2="44" y2="51" stroke="#d0c0b0" stroke-width="1.2"/>
    <line x1="30" y1="53" x2="44" y2="53" stroke="#d0c0b0" stroke-width="1.2"/>
    <line x1="76" y1="51" x2="90" y2="48" stroke="#d0c0b0" stroke-width="1.2"/>
    <line x1="76" y1="53" x2="90" y2="53" stroke="#d0c0b0" stroke-width="1.2"/>
    <!-- Paws holding belly -->
    <ellipse cx="44" cy="82" rx="7" ry="5" fill="#e8e0d0"/>
    <ellipse cx="76" cy="82" rx="7" ry="5" fill="#e8e0d0"/>
    <!-- Tail -->
    <path d="M85 78 Q94 64 90 52" stroke="#e8e0d0" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>