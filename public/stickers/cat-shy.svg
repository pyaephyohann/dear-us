<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes peek { 0%,100%{transform:translateX(0) rotate(0deg)} 50%{transform:translateX(-3px) rotate(-2deg)} }
    @keyframes blush-pulse { 0%,100%{opacity:.35} 50%{opacity:.6} }
    @keyframes float-heart { 0%,100%{transform:translateY(0) scale(.9);opacity:.5} 50%{transform:translateY(-6px) scale(1.05);opacity:.8} }
    .pk{animation:peek 2.5s ease-in-out infinite}
    .bl{animation:blush-pulse 2s ease-in-out infinite}
    .fh{animation:float-heart 2.2s ease-in-out infinite .3s}
    @media(prefers-reduced-motion:reduce){.pk,.bl,.fh{animation:none}}
  </style>
  <!-- Small shy hearts -->
  <g class="fh"><path d="M78 18c0-2 1.8-3.5 3.5-3.5s3.5 1.5 3.5 3.5c0 2.5-3.5 4.5-3.5 4.5s-3.5-2-3.5-4.5z" fill="#ffb3c6" opacity=".6"/></g>
  <g class="fh" style="animation-delay:.8s"><path d="M90 25c0-1.5 1.3-2.5 2.5-2.5s2.5 1 2.5 2.5c0 1.8-2.5 3.2-2.5 3.2s-2.5-1.4-2.5-3.2z" fill="#ffccd5" opacity=".5"/></g>
  <!-- Shy cat — turned slightly, one paw covering face -->
  <g class="pk">
    <!-- Body (slightly turned) -->
    <ellipse cx="58" cy="78" rx="26" ry="22" fill="#e8d5c8"/>
    <!-- Head -->
    <circle cx="56" cy="50" r="24" fill="#e8d5c8"/>
    <!-- Ears -->
    <path d="M34 34 L28 10 L46 28Z" fill="#e8d5c8"/>
    <path d="M76 34 L82 10 L64 28Z" fill="#e8d5c8"/>
    <path d="M36 32 L31 15 L45 29Z" fill="#d4b0a0"/>
    <path d="M74 32 L79 15 L65 29Z" fill="#d4b0a0"/>
    <!-- Eyes — looking away, half-closed shy -->
    <ellipse cx="46" cy="48" rx="4" ry="3.5" fill="#3d2c2c"/>
    <circle cx="44" cy="47" r="1.5" fill="white"/>
    <ellipse cx="64" cy="47" rx="3.5" ry="3" fill="#3d2c2c"/>
    <circle cx="63" cy="46" r="1.3" fill="white"/>
    <!-- Big blush marks -->
    <ellipse cx="38" cy="53" rx="6" ry="3.5" fill="#ffb3a0" opacity=".5" class="bl"/>
    <ellipse cx="72" cy="52" rx="6" ry="3.5" fill="#ffb3a0" opacity=".5" class="bl"/>
    <!-- Nose -->
    <path d="M54 51 L56 54 L58 51Z" fill="#e88a9a"/>
    <!-- Tiny shy smile -->
    <path d="M52 55 Q56 58 60 55" stroke="#3d2c2c" strokeWidth="1.5" fill="none" stroke-linecap="round"/>
    <!-- Paw covering face (peeking) -->
    <ellipse cx="68" cy="50" rx="10" ry="8" fill="#e8d5c8" transform="rotate(10 68 50)"/>
    <circle cx="64" cy="48" r="1.8" fill="#d4b0a0" opacity=".4"/>
    <circle cx="68" cy="46" r="1.8" fill="#d4b0a0" opacity=".4"/>
    <circle cx="72" cy="48" r="1.8" fill="#d4b0a0" opacity=".4"/>
    <!-- Whiskers -->
    <line x1="28" y1="48" x2="40" y2="51" stroke="#c8b0a0" stroke-width="1"/>
    <line x1="28" y1="53" x2="40" y2="53" stroke="#c8b0a0" stroke-width="1"/>
    <!-- Other paw -->
    <ellipse cx="42" cy="90" rx="8" ry="5" fill="#e8d5c8"/>
    <!-- Tail curled shyly -->
    <path d="M84 78 Q92 68 88 58 Q84 52 80 56" stroke="#e8d5c8" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>