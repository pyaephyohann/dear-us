<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes kiss-float { 0%{transform:translate(0,0) scale(.8) rotate(0deg);opacity:0} 20%{opacity:1} 100%{transform:translate(12px,-22px) scale(1.1) rotate(15deg);opacity:0} }
    @keyframes head-tilt { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(5deg)} }
    @keyframes paw-wave { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-10deg)} }
    .kf{animation:kiss-float 2s ease-out infinite}
    .kf2{animation:kiss-float 2s ease-out infinite .7s}
    .ht{animation:head-tilt 2.5s ease-in-out infinite}
    .pw{animation:paw-wave 1.5s ease-in-out infinite;transform-origin:38px 72px}
    @media(prefers-reduced-motion:reduce){.kf,.kf2,.ht,.pw{animation:none}}
  </style>
  <!-- Floating kiss hearts -->
  <g class="kf"><path d="M72 28c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5c0 3-4.5 5.5-4.5 5.5s-4.5-2.5-4.5-5.5z" fill="#ff6b8a"/></g>
  <g class="kf2"><path d="M78 18c0-1.8 1.5-3 3-3s3 1.2 3 3c0 2-3 3.8-3 3.8s-3-1.8-3-3.8z" fill="#ff8fa8" opacity=".7"/></g>
  <!-- Cat body -->
  <g class="ht">
    <ellipse cx="55" cy="78" rx="26" ry="22" fill="#f0d5c0"/>
    <circle cx="52" cy="50" r="24" fill="#f0d5c0"/>
    <!-- Ears -->
    <path d="M30 34 L24 10 L42 28Z" fill="#f0d5c0"/>
    <path d="M72 34 L78 10 L60 28Z" fill="#f0d5c0"/>
    <path d="M32 32 L27 15 L41 29Z" fill="#e0b8a0"/>
    <path d="M70 32 L75 15 L61 29Z" fill="#e0b8a0"/>
    <!-- One eye winking, one open -->
    <ellipse cx="40" cy="48" rx="4.5" ry="5" fill="#3d2c2c"/>
    <circle cx="38" cy="46" r="2" fill="white"/>
    <circle cx="42" cy="49" r="1" fill="white" opacity=".6"/>
    <!-- Winking eye -->
    <path d="M60 46 Q64 42 68 46" stroke="#3d2c2c" strokeWidth="2.5" fill="none" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="34" cy="53" rx="5" ry="3" fill="#ffb3a0" opacity=".45"/>
    <ellipse cx="68" cy="52" rx="5" ry="3" fill="#ffb3a0" opacity=".45"/>
    <!-- Nose -->
    <path d="M50 51 L52 54 L54 51Z" fill="#e88a9a"/>
    <!-- Kiss mouth — pursed -->
    <ellipse cx="52" cy="57" rx="3" ry="2.5" fill="#e88a9a" opacity=".8"/>
    <!-- Whiskers -->
    <line x1="24" y1="48" x2="36" y2="51" stroke="#d0b8a8" stroke-width="1.2"/>
    <line x1="24" y1="53" x2="36" y2="53" stroke="#d0b8a8" stroke-width="1.2"/>
    <line x1="66" y1="51" x2="78" y2="48" stroke="#d0b8a8" stroke-width="1.2"/>
    <line x1="66" y1="53" x2="78" y2="53" stroke="#d0b8a8" stroke-width="1.2"/>
    <!-- Paw blowing kiss -->
    <g class="pw">
      <ellipse cx="38" cy="72" rx="7" ry="5" fill="#f0d5c0" transform="rotate(-20 38 72)"/>
      <circle cx="35" cy="71" r="1.6" fill="#e0b8a0" opacity=".5"/>
      <circle cx="38" cy="69" r="1.6" fill="#e0b8a0" opacity=".5"/>
      <circle cx="41" cy="71" r="1.6" fill="#e0b8a0" opacity=".5"/>
    </g>
    <!-- Other paw -->
    <ellipse cx="72" cy="90" rx="8" ry="5" fill="#f0d5c0"/>
    <!-- Tail -->
    <path d="M81 78 Q90 65 86 54" stroke="#f0d5c0" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>