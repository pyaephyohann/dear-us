<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes sparkle { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.4);opacity:1} }
    @keyframes sparkle2 { 0%,100%{transform:scale(.8);opacity:.5} 50%{transform:scale(1.2);opacity:.9} }
    @keyframes dance { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(4deg)} 75%{transform:rotate(-4deg)} }
    @keyframes tailwag { 0%,100%{transform:rotate(0deg);transform-origin:90px 75px} 30%{transform:rotate(8deg);transform-origin:90px 75px} 70%{transform:rotate(-8deg);transform-origin:90px 75px} }
    .bnc{animation:bounce .8s ease-in-out infinite}
    .sp1{animation:sparkle 1.5s ease-in-out infinite}
    .sp2{animation:sparkle2 1.8s ease-in-out infinite .4s}
    .sp3{animation:sparkle 2s ease-in-out infinite .8s}
    .dnc{animation:dance 1s ease-in-out infinite}
    .tw{animation:tailwag .8s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.bnc,.sp1,.sp2,.sp3,.dnc,.tw{animation:none}}
  </style>
  <!-- Sparkles -->
  <g class="sp1"><path d="M22 22l2-6 2 6 6 2-6 2-2 6-2-6-6-2z" fill="#FFD700" opacity=".8"/></g>
  <g class="sp2"><path d="M90 18l1.5-4.5 1.5 4.5 4.5 1.5-4.5 1.5-1.5 4.5-1.5-4.5-4.5-1.5z" fill="#FFD700" opacity=".7"/></g>
  <g class="sp3"><path d="M55 6l1-3 1 3 3 1-3 1-1 3-1-3-3-1z" fill="#FFE066" opacity=".6"/></g>
  <g class="sp1"><path d="M100 40l1-3 1 3 3 1-3 1-1 3-1-3-3-1z" fill="#FFD700" opacity=".5"/></g>
  <!-- Bouncing cat body -->
  <g class="bnc">
    <g class="dnc">
      <!-- Body -->
      <ellipse cx="60" cy="78" rx="25" ry="22" fill="#f5deb3"/>
      <!-- Head -->
      <circle cx="60" cy="48" r="23" fill="#f5deb3"/>
      <!-- Ears -->
      <path d="M39 32 L33 8 L51 26Z" fill="#f5deb3"/>
      <path d="M81 32 L87 8 L69 26Z" fill="#f5deb3"/>
      <path d="M41 30 L36 13 L50 27Z" fill="#f0c8a0"/>
      <path d="M79 30 L84 13 L70 27Z" fill="#f0c8a0"/>
      <!-- Super happy closed eyes -->
      <path d="M46 44 Q50 39 54 44" stroke="#3d2c2c" strokeWidth="2.5" fill="none" stroke-linecap="round"/>
      <path d="M66 44 Q70 39 74 44" stroke="#3d2c2c" strokeWidth="2.5" fill="none" stroke-linecap="round"/>
      <!-- Blush -->
      <ellipse cx="40" cy="50" rx="5" ry="3" fill="#ffb8a0" opacity=".5"/>
      <ellipse cx="80" cy="50" rx="5" ry="3" fill="#ffb8a0" opacity=".5"/>
      <!-- Nose -->
      <path d="M58 50 L60 53 L62 50Z" fill="#e88a9a"/>
      <!-- Big open mouth smile -->
      <path d="M50 54 Q60 66 70 54" stroke="#3d2c2c" strokeWidth="2" fill="#fff" stroke-linecap="round"/>
      <!-- Tongue -->
      <ellipse cx="60" cy="59" rx="4" ry="3" fill="#ff8fa8"/>
      <!-- Whiskers -->
      <line x1="30" y1="48" x2="42" y2="50" stroke="#d4b8a8" stroke-width="1.2"/>
      <line x1="30" y1="53" x2="42" y2="53" stroke="#d4b8a8" stroke-width="1.2"/>
      <line x1="78" y1="50" x2="90" y2="48" stroke="#d4b8a8" stroke-width="1.2"/>
      <line x1="78" y1="53" x2="90" y2="53" stroke="#d4b8a8" stroke-width="1.2"/>
      <!-- Paws up celebrating -->
      <ellipse cx="36" cy="72" rx="7" ry="5.5" fill="#f5deb3" transform="rotate(-25 36 72)"/>
      <ellipse cx="84" cy="72" rx="7" ry="5.5" fill="#f5deb3" transform="rotate(25 84 72)"/>
      <!-- Paw pads -->
      <circle cx="34" cy="71" r="1.8" fill="#f0c8a0" opacity=".5"/>
      <circle cx="37" cy="70" r="1.8" fill="#f0c8a0" opacity=".5"/>
      <circle cx="82" cy="71" r="1.8" fill="#f0c8a0" opacity=".5"/>
      <circle cx="85" cy="70" r="1.8" fill="#f0c8a0" opacity=".5"/>
      <!-- Tail -->
      <path d="M85 78 Q95 62 90 50" stroke="#f5deb3" stroke-width="5" fill="none" stroke-linecap="round" class="tw"/>
    </g>
  </g>
</svg>