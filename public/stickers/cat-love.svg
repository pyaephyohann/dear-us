<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes float1 { 0%,100%{transform:translateY(0) scale(1);opacity:.8} 50%{transform:translateY(-8px) scale(1.1);opacity:1} }
    @keyframes float2 { 0%,100%{transform:translateY(0) scale(1);opacity:.6} 50%{transform:translateY(-10px) scale(1.15);opacity:.9} }
    @keyframes float3 { 0%,100%{transform:translateY(0) scale(.9);opacity:.5} 50%{transform:translateY(-7px) scale(1.05);opacity:.8} }
    @keyframes wiggle { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(3deg)} 75%{transform:rotate(-3deg)} }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
    .h1{animation:float1 2s ease-in-out infinite}
    .h2{animation:float2 2.4s ease-in-out infinite .3s}
    .h3{animation:float3 2.8s ease-in-out infinite .6s}
    .wig{animation:wiggle 2s ease-in-out infinite}
    .pu{animation:pulse 2.5s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.h1,.h2,.h3,.wig,.pu{animation:none}}
  </style>
  <!-- Floating hearts -->
  <g class="h1"><path d="M25 18c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5c0 4-5.5 7-5.5 7s-5.5-3-5.5-7z" fill="#ff6b8a" opacity=".85"/></g>
  <g class="h2"><path d="M82 14c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5c0 3.5-4.5 6-4.5 6s-4.5-2.5-4.5-6z" fill="#ff8fa8" opacity=".7"/></g>
  <g class="h3"><path d="M55 8c0-2 1.8-3.5 3.5-3.5s3.5 1.5 3.5 3.5c0 2.5-3.5 4.5-3.5 4.5s-3.5-2-3.5-4.5z" fill="#ffb3c6" opacity=".6"/></g>
  <!-- Body -->
  <g class="pu">
    <ellipse cx="60" cy="78" rx="26" ry="22" fill="#ffd4b8"/>
    <!-- Head -->
    <circle cx="60" cy="50" r="24" fill="#ffd4b8"/>
    <!-- Ears -->
    <path d="M38 34 L32 10 L50 28Z" fill="#ffd4b8"/>
    <path d="M82 34 L88 10 L70 28Z" fill="#ffd4b8"/>
    <path d="M40 32 L35 15 L49 29Z" fill="#ffb8a0"/>
    <path d="M80 32 L85 15 L71 29Z" fill="#ffb8a0"/>
  </g>
  <!-- Eyes — big sparkly happy -->
  <g class="wig">
    <ellipse cx="48" cy="48" rx="5.5" ry="6" fill="#3d2c2c"/>
    <ellipse cx="72" cy="48" rx="5.5" ry="6" fill="#3d2c2c"/>
    <circle cx="46" cy="46" r="2.2" fill="white"/>
    <circle cx="70" cy="46" r="2.2" fill="white"/>
    <circle cx="50" cy="49" r="1.2" fill="white" opacity=".7"/>
    <circle cx="74" cy="49" r="1.2" fill="white" opacity=".7"/>
  </g>
  <!-- Blush -->
  <ellipse cx="40" cy="54" rx="5" ry="3" fill="#ffb3a0" opacity=".45"/>
  <ellipse cx="80" cy="54" rx="5" ry="3" fill="#ffb3a0" opacity=".45"/>
  <!-- Nose -->
  <path d="M58 52 L60 55 L62 52Z" fill="#e88a9a"/>
  <!-- Big happy mouth -->
  <path d="M52 56 Q60 64 68 56" stroke="#3d2c2c" strokeWidth="2" fill="none" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="32" y1="50" x2="44" y2="52" stroke="#d4b8a8" stroke-width="1.2"/>
  <line x1="32" y1="55" x2="44" y2="55" stroke="#d4b8a8" stroke-width="1.2"/>
  <line x1="76" y1="52" x2="88" y2="50" stroke="#d4b8a8" stroke-width="1.2"/>
  <line x1="76" y1="55" x2="88" y2="55" stroke="#d4b8a8" stroke-width="1.2"/>
  <!-- Paws reaching up (hugging gesture) -->
  <ellipse cx="40" cy="70" rx="7" ry="5" fill="#ffd4b8" transform="rotate(-15 40 70)"/>
  <ellipse cx="80" cy="70" rx="7" ry="5" fill="#ffd4b8" transform="rotate(15 80 70)"/>
  <!-- Paw pads -->
  <circle cx="38" cy="69" r="1.8" fill="#ffb8a0" opacity=".5"/>
  <circle cx="41" cy="68" r="1.8" fill="#ffb8a0" opacity=".5"/>
  <circle cx="78" cy="69" r="1.8" fill="#ffb8a0" opacity=".5"/>
  <circle cx="81" cy="68" r="1.8" fill="#ffb8a0" opacity=".5"/>
  <!-- Tail wagging -->
  <path d="M86 78 Q96 65 92 52" stroke="#ffd4b8" stroke-width="5" fill="none" stroke-linecap="round" class="wig"/>
</svg>