<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes bob { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(2px) rotate(1deg)} }
    @keyframes zzz1 { 0%{transform:translate(0,0) scale(.8);opacity:0} 30%{opacity:.8} 100%{transform:translate(8px,-18px) scale(1.1);opacity:0} }
    @keyframes zzz2 { 0%{transform:translate(0,0) scale(.7);opacity:0} 30%{opacity:.6} 100%{transform:translate(12px,-14px) scale(1);opacity:0} }
    @keyframes zzz3 { 0%{transform:translate(0,0) scale(.6);opacity:0} 30%{opacity:.5} 100%{transform:translate(10px,-10px) scale(.9);opacity:0} }
    @keyframes blink { 0%,40%,100%{ry:3.5} 45%,55%{ry:0.5} }
    .bb{animation:bob 3s ease-in-out infinite}
    .z1{animation:zzz1 3s ease-out infinite}
    .z2{animation:zzz2 3s ease-out infinite 1s}
    .z3{animation:zzz3 3s ease-out infinite 2s}
    .bk{animation:blink 4s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.bb,.z1,.z2,.z3,.bk{animation:none}}
  </style>
  <!-- Floating Zzz -->
  <g class="z1"><text x="75" y="35" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b8a8d0" opacity=".8">z</text></g>
  <g class="z2"><text x="85" y="25" font-family="sans-serif" font-size="10" font-weight="bold" fill="#c8b8d8" opacity=".6">z</text></g>
  <g class="z3"><text x="80" y="18" font-family="sans-serif" font-size="8" font-weight="bold" fill="#d8c8e8" opacity=".5">z</text></g>
  <!-- Sleepy curled cat -->
  <g class="bb">
    <!-- Body (curled up) -->
    <ellipse cx="58" cy="75" rx="28" ry="24" fill="#e0d5e8"/>
    <circle cx="55" cy="52" r="23" fill="#e0d5e8"/>
    <!-- Ears (droopy) -->
    <path d="M34 36 L30 15 L46 30Z" fill="#e0d5e8"/>
    <path d="M72 36 L78 15 L60 30Z" fill="#e0d5e8"/>
    <path d="M36 34 L32 18 L45 31Z" fill="#c8b0d0"/>
    <path d="M70 34 L76 18 L61 31Z" fill="#c8b0d0"/>
    <!-- Half-closed sleepy eyes -->
    <ellipse cx="45" cy="50" rx="5" ry="1.5" fill="#3d2c2c" opacity=".7"/>
    <ellipse cx="65" cy="50" rx="5" ry="1.5" fill="#3d2c2c" opacity=".7"/>
    <!-- Tiny eyelashes -->
    <line x1="40" y1="49" x2="38" y2="47" stroke="#3d2c2c" stroke-width="1" opacity=".5"/>
    <line x1="60" y1="49" x2="58" y2="47" stroke="#3d2c2c" stroke-width="1" opacity=".5"/>
    <!-- Soft blush -->
    <ellipse cx="38" cy="54" rx="5" ry="2.5" fill="#d8b8c8" opacity=".4"/>
    <ellipse cx="72" cy="54" rx="5" ry="2.5" fill="#d8b8c8" opacity=".4"/>
    <!-- Nose -->
    <path d="M53 52 L55 55 L57 52Z" fill="#d8a0b0"/>
    <!-- Sleepy mouth (tiny) -->
    <path d="M52 56 Q55 58 58 56" stroke="#3d2c2c" strokeWidth="1.2" fill="none" stroke-linecap="round"/>
    <!-- Whiskers (droopy) -->
    <line x1="28" y1="52" x2="40" y2="53" stroke="#c8b8c0" stroke-width="1"/>
    <line x1="28" y1="56" x2="40" y2="56" stroke="#c8b8c0" stroke-width="1"/>
    <line x1="70" y1="53" x2="82" y2="52" stroke="#c8b8c0" stroke-width="1"/>
    <line x1="70" y1="56" x2="82" y2="56" stroke="#c8b8c0" stroke-width="1"/>
    <!-- Curled tail around body -->
    <path d="M86 72 Q94 62 88 54 Q82 48 78 54 Q74 60 80 66" stroke="#e0d5e8" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Paw tucked in -->
    <ellipse cx="42" cy="88" rx="8" ry="4.5" fill="#e0d5e8"/>
    <circle cx="40" cy="87" r="1.5" fill="#c8b0d0" opacity=".4"/>
    <circle cx="43" cy="86" r="1.5" fill="#c8b0d0" opacity=".4"/>
  </g>
</svg>